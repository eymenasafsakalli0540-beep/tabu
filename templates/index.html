<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tabu — Siret-i Nebi</title>
<style>
  :root{
    --bg:#f4f1ea; --panel:#ffffff; --ink:#22303c; --muted:#6b7a86;
    --accent:#0e7c66; --accent2:#c0392b; --gold:#b8862b; --border:#e1dbc9;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14201d; --panel:#1c2a26; --ink:#eef3f0; --muted:#9fb0aa;
      --accent:#3fd6ab; --accent2:#ff7a68; --gold:#e0b055; --border:#2c3a35;
    }
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh;}
  .wrap{max-width:1000px;margin:0 auto;padding:24px 16px 60px;}
  h1{font-size:clamp(22px,4vw,34px);margin:0 0 4px;color:var(--accent);}
  .sub{color:var(--muted);margin:0 0 20px;font-size:14px;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:18px;}
  .scoreboard{display:flex;gap:14px;}
  .team{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:14px;padding:16px;text-align:center;}
  .team.active{outline:3px solid var(--accent);}
  .team h3{margin:0 0 6px;font-size:15px;color:var(--muted);}
  .team .score{font-size:44px;font-weight:800;color:var(--accent);}
  .timer{font-size:clamp(48px,10vw,88px);font-weight:800;text-align:center;color:var(--ink);letter-spacing:2px;}
  .timer.low{color:var(--accent2);}
  #qrbox{display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px;}
  #qrcode{background:#fff;padding:10px;border-radius:12px;}
  .hint{font-size:13px;color:var(--muted);text-align:center;max-width:280px;}
  button{font-size:16px;font-weight:700;border:none;border-radius:12px;padding:14px 18px;cursor:pointer;color:#fff;background:var(--accent);}
  button.secondary{background:var(--muted);}
  button.bad{background:var(--accent2);}
  button.gold{background:var(--gold);}
  .btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;}
  select,input[type=number]{font-size:16px;padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--panel);color:var(--ink);}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;}
  .field label{font-size:13px;color:var(--muted);}
  .wordcard{background:var(--panel);border:2px solid var(--accent);border-radius:18px;padding:26px;text-align:center;}
  .word{font-size:clamp(30px,8vw,46px);font-weight:800;color:var(--accent2);margin:6px 0 18px;}
  .forbidden{list-style:none;padding:0;margin:0 0 6px;display:flex;flex-direction:column;gap:8px;}
  .forbidden li{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px;font-size:19px;font-weight:600;}
  .badge{display:inline-block;background:var(--gold);color:#221a08;font-weight:700;font-size:12px;border-radius:20px;padding:4px 12px;margin-bottom:10px;}
  .status{font-size:13px;color:var(--muted);text-align:center;margin-top:10px;}
  .log{font-size:13px;color:var(--muted);margin-top:10px;text-align:center;}
  .reveal-btn{width:100%;padding:22px;font-size:20px;}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<!-- Kelimeler sadece sunucudan /api/words ile çekilir, HTML kaynağında görünmez -->
<script>
const isMobileUA = /Android|iPhone|iPad|iPod|Mobile|Windows Phone/i.test(navigator.userAgent);
const isCoarsePointer = window.matchMedia("(pointer: coarse)").matches;
const isPhone = isMobileUA && isCoarsePointer && window.matchMedia("(max-width: 900px)").matches;
const app = document.getElementById('app');

let state = null;
let WORDS = [];

async function fetchState(){
  const r = await fetch('/api/state');
  return r.json();
}
async function pushState(newState){
  const r = await fetch('/api/state', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(newState)
  });
  return r.json();
}

// ================= BOARD MODE =================
function renderBoard(){
  app.innerHTML = `
    <h1>🕌 Tabu — Siret-i Nebi</h1>
    <p class="sub">Telefonunuzla QR kodu okutun, kelime ve süre orada görünecek. Skor ve süre burada, tüm sınıfa açık.</p>

    <div class="card">
      <div class="scoreboard">
        <div class="team ${state.activeTeam==='teamA'?'active':''}">
          <h3>${state.teamA.name}</h3>
          <div class="score">${state.teamA.score}</div>
        </div>
        <div class="team ${state.activeTeam==='teamB'?'active':''}">
          <h3>${state.teamB.name}</h3>
          <div class="score">${state.teamB.score}</div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="timer ${state.timeLeft<=10 && state.running?'low':''}">${state.timeLeft}s</div>
      <div class="status">${state.running ? "Tur devam ediyor — sırada " + (state.activeTeam==='teamA'?state.teamA.name:state.teamB.name) : "Bekleniyor"}</div>
      <div class="log">Kalan kelime: ${state.wordsLeft} ${state.lastResult ? " · Son sonuç: " + state.lastResult : ""}</div>
    </div>

    <div class="card" id="qrbox" style="${state.running ? 'display:none;' : ''}">
      <div id="qrcode"></div>
      <div class="hint">Oyunu yöneten kişi bu QR kodu telefonuyla okutsun (tahtayla aynı ağda olmalı). Açılan sayfada kelime, yasaklılar ve Doğru / Pas butonları olacak.</div>
    </div>
  `;
  const qrEl = document.getElementById('qrcode');
  if (qrEl && !state.running && window.qrcode) {
    try {
      const qr = qrcode(0, 'M');
      qr.addData(window.location.href);
      qr.make();
      qrEl.innerHTML = qr.createSvgTag({cellSize:5, margin:4});
      const svg = qrEl.querySelector('svg');
      if (svg) { svg.style.width = "220px"; svg.style.height = "220px"; svg.style.display = "block"; }
    } catch(e) {
      qrEl.innerHTML = '<div style="font-size:12px;">QR oluşturulamadı. Linki elle paylaşın: ' + window.location.href + '</div>';
    }
  }
}

async function boardLoop(){
  state = await fetchState();
  renderBoard();
  setInterval(async () => {
    state = await fetchState();
    renderBoard();
  }, 1000);
}

// ================= PHONE MODE =================
let usedIndexes = [];
let currentWord = null;
let timerInterval = null;
let revealed = false;

function pickWord(){
  if (usedIndexes.length >= WORDS.length) usedIndexes = [];
  let idx;
  do { idx = Math.floor(Math.random()*WORDS.length); } while (usedIndexes.includes(idx));
  usedIndexes.push(idx);
  state.wordsLeft = WORDS.length - usedIndexes.length;
  currentWord = WORDS[idx];
}

function renderPhone(){
  app.innerHTML = `
    <h1>🕌 Tabu Kontrol</h1>
    <p class="sub">Bu ekranı sadece anlatan kişi görsün, tahtaya çevirmeyin 🙂</p>

    <div class="card">
      <div class="field">
        <label>Sırada hangi takım anlatıyor?</label>
        <select id="teamSel">
          <option value="teamA" ${state.activeTeam==='teamA'?'selected':''}>${state.teamA.name}</option>
          <option value="teamB" ${state.activeTeam==='teamB'?'selected':''}>${state.teamB.name}</option>
        </select>
      </div>
      <div class="field">
        <label>Süre (saniye)</label>
        <input type="number" id="timeInput" value="60" min="10" max="180">
      </div>
      <button id="startBtn" class="gold" style="width:100%">🎬 Turu Başlat</button>
    </div>

    <div class="card wordcard" id="wordCard" style="display:none;">
      <span class="badge">Kalan kelime: <span id="leftCount">${state.wordsLeft}</span>/${WORDS.length}</span>
      <div id="timerPhone" class="timer">--</div>
      <div id="revealArea"></div>
    </div>

    <div class="card scoreboard">
      <div class="team"><h3>${state.teamA.name}</h3><div class="score" id="scoreA">${state.teamA.score}</div></div>
      <div class="team"><h3>${state.teamB.name}</h3><div class="score" id="scoreB">${state.teamB.score}</div></div>
    </div>
  `;
  document.getElementById('startBtn').onclick = startRound;
}

async function startRound(){
  state.activeTeam = document.getElementById('teamSel').value;
  const secs = parseInt(document.getElementById('timeInput').value || "60", 10);
  state.timeLeft = secs;
  state.running = true;
  state.lastResult = null;
  revealed = false;
  pickWord();
  document.getElementById('wordCard').style.display = 'block';
  renderRevealArea();
  await pushState(state);
  startTimer();
}

function renderRevealArea(){
  const area = document.getElementById('revealArea');
  document.getElementById('timerPhone').textContent = state.timeLeft + "s";
  area.innerHTML = `
    <div class="word">${currentWord.word}</div>
    <ul class="forbidden">${currentWord.forbidden.map(f=>`<li>${f}</li>`).join('')}</ul>
    <div class="btnrow">
      <button style="flex:1" onclick="handleResult('doğru')">✅ Doğru</button>
      <button class="secondary" style="flex:1" onclick="handleResult('pas')">⏭ Pas</button>
    </div>
    <div class="btnrow">
      <button class="bad" style="flex:1" onclick="endRound('süre bitti')">⏹ Süreyi Bitir</button>
    </div>
  `;
}

async function handleResult(result){
  if (result === 'doğru') state[state.activeTeam].score += 1;
  state.lastResult = result;
  document.getElementById('scoreA').textContent = state.teamA.score;
  document.getElementById('scoreB').textContent = state.teamB.score;
  if (state.wordsLeft <= 0){ await endRound(result); return; }
  revealed = false;
  pickWord();
  document.getElementById('leftCount').textContent = state.wordsLeft;
  renderRevealArea();
  await pushState(state);
}

async function endRound(reason){
  state.running = false;
  state.lastResult = reason;
  clearInterval(timerInterval);
  await pushState(state);
  renderPhone();
}

function startTimer(){
  clearInterval(timerInterval);
  timerInterval = setInterval(async ()=>{
    state.timeLeft -= 1;
    if (state.timeLeft <= 0){
      state.timeLeft = 0;
      await endRound('süre bitti');
      return;
    }
    const t = document.getElementById('timerPhone');
    if (t) t.textContent = state.timeLeft + "s";
    await pushState(state);
  }, 1000);
}

window.handleResult = handleResult;
window.endRound = endRound;

// ---------- init ----------
(async () => {
  state = await fetchState();
  if (isPhone) {
    WORDS = await (await fetch('/api/words')).json();
    renderPhone();
  } else {
    boardLoop();
  }
})();
</script>

<!-- QR kütüphanesi (kazuhikoarase/qrcode-generator, MIT) - static/qrcode.min.js -->
<script src="/static/qrcode.min.js"></script>
</body>
</html>
